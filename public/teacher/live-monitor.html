<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Proctoring Console - Smart Exam System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
      <h1 class="text-lg font-bold">Live Proctoring Dashboard</h1>
    </div>
    <div id="active-exam-label" class="text-sm font-mono text-gray-400">Exam ID: Not Selected</div>
  </header>

  <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Connected Candidates List -->
    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
      <h2 class="font-bold text-sm text-gray-300 uppercase mb-4">Active Candidates (<span id="candidate-count">0</span>)</h2>
      <div id="student-list" class="space-y-2 max-h-[70vh] overflow-y-auto">
        <!-- Dynamic Student Items -->
      </div>
    </div>

    <!-- Live Event Feed -->
    <div class="lg:col-span-2 bg-gray-800 rounded-lg p-4 border border-gray-700 flex flex-col justify-between">
      <div>
        <h2 class="font-bold text-sm text-gray-300 uppercase mb-4">Proctoring Event Feed</h2>
        <div id="event-log" class="space-y-2 font-mono text-xs max-h-[60vh] overflow-y-auto bg-gray-950 p-4 rounded border border-gray-800">
          <div class="text-gray-500">[System] Connected to proctoring server...</div>
        </div>
      </div>

      <!-- Quick Action Console -->
      <div class="pt-4 border-t border-gray-700 flex space-x-2">
        <input type="text" id="warn-student-id" placeholder="Student ID" class="w-1/3 bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white">
        <input type="text" id="warn-message" placeholder="Warning Message..." class="w-2/3 bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white">
        <button id="send-warn-btn" class="bg-yellow-600 hover:bg-yellow-700 font-bold px-4 py-2 rounded text-sm text-white">Warn</button>
      </div>
    </div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/live-monitor.js"></script>
</body>
</html>
