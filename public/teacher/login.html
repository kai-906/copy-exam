<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal - Smart Exam System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="glass-card rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-8 relative overflow-hidden">
    <!-- Decorative Blob -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob animation-delay-2000"></div>

    <div class="text-center relative z-10">
      <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Teacher Portal</h1>
      <p class="text-slate-500 text-sm mt-2">Manage question banks and exams</p>
    </div>
    
    <!-- Tab Switchers -->
    <div class="flex p-1 bg-slate-100 rounded-lg relative z-10">
      <button id="tab-login" onclick="switchForm('login')" class="flex-1 py-2 text-center text-sm font-bold rounded-md bg-white text-indigo-600 shadow-sm transition-all duration-300">Sign In</button>
      <button id="tab-register" onclick="switchForm('register')" class="flex-1 py-2 text-center text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all duration-300">Create Account</button>
    </div>

    <!-- Error/Success Message Alert -->
    <div id="msg-box" class="hidden p-4 rounded-lg text-sm font-medium border relative z-10 shadow-sm transition-all duration-300"></div>

    <!-- Login Form -->
    <form id="form-login" class="space-y-5 relative z-10">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Email Address</label>
        <input type="email" id="login-email" required placeholder="teacher@school.edu" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide">Password</label>
          <a href="forgot-password.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-500 hover:underline transition-colors">Forgot Password?</a>
        </div>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-3.5 rounded-xl hover:from-indigo-700 hover:to-blue-700 text-sm transition-all transform hover:-translate-y-0.5 shadow-lg shadow-indigo-500/30">
        Sign Into Dashboard
      </button>
    </form>

    <!-- Register Form -->
    <form id="form-register" class="space-y-5 hidden relative z-10">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Email Address</label>
        <input type="email" id="reg-email" required placeholder="teacher@school.edu" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Create Password</label>
        <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3.5 rounded-xl hover:from-emerald-600 hover:to-teal-600 text-sm transition-all transform hover:-translate-y-0.5 shadow-lg shadow-emerald-500/30">
        Create Teacher Account
      </button>
    </form>

  </div>

  <script src="/js/api.js"></script>
  <script>
    const msgBox = document.getElementById('msg-box');

    function switchForm(type) {
      msgBox.classList.add('hidden');
      const tabActive = 'flex-1 py-2 text-center text-sm font-bold rounded-md bg-white text-indigo-600 shadow-sm transition-all duration-300';
      const tabInactive = 'flex-1 py-2 text-center text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all duration-300';
      
      if (type === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('tab-login').className = tabActive;
        document.getElementById('tab-register').className = tabInactive;
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
        document.getElementById('tab-register').className = tabActive.replace('indigo', 'emerald');
        document.getElementById('tab-login').className = tabInactive;
      }
    }

    function showMsg(text, isError = true) {
      msgBox.textContent = text;
      msgBox.className = `p-4 rounded-lg text-sm font-medium border relative z-10 shadow-sm transition-all duration-300 ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
      msgBox.classList.remove('hidden');
    }

    // Login Form Submit Handler
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await Api.loginTeacher({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        });
        Api.setToken(res.token);
        window.location.href = '/teacher/dashboard.html';
      } catch (err) {
        showMsg(err.message);
      }
    });

    // Register Form Submit Handler
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await Api.registerTeacher({
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-password').value
        });
        showMsg('Account created successfully! Please sign in.', false);
        switchForm('login');
      } catch (err) {
        showMsg(err.message);
      }
    });
  </script>
</body>
</html>
