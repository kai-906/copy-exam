<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — SmartExam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; }
    .inp { @apply w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg outline-none transition; }
    .inp:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.18); }
    .inp::placeholder { color: #475569; }
    .lbl { display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase;
           letter-spacing:.06em; color:#94a3b8; margin-bottom:5px; }
    .btn-primary { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
                   border:none; border-radius:.6rem; padding:.75rem 1.5rem;
                   font-weight:700; font-size:.9rem; cursor:pointer; width:100%;
                   transition:opacity .2s,transform .1s; }
    .btn-primary:hover:not(:disabled) { opacity:.9; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .card { background:rgba(30,41,59,0.85); border:1px solid rgba(99,102,241,0.18);
            border-radius:1.2rem; padding:2.2rem; backdrop-filter:blur(12px);
            box-shadow:0 24px 48px rgba(0,0,0,0.45); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-sm">

    <!-- Logo / Brand -->
    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 mb-3">
        <svg class="w-7 h-7 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">SmartExam</h1>
      <p class="text-slate-400 text-xs mt-1">Student Portal</p>
    </div>

    <!-- Login Card -->
    <div class="card">
      <h2 class="text-lg font-bold text-white mb-5">Sign In</h2>

      <div id="alert-box" class="hidden mb-4 px-4 py-2.5 rounded-lg text-xs font-semibold bg-red-500/10 border border-red-500/30 text-red-400"></div>

      <form id="login-form" class="space-y-4" autocomplete="off">

        <div>
          <label class="lbl" for="roll">Roll Number</label>
          <input type="text" id="roll" name="roll" required autocomplete="off"
            placeholder="e.g. 2400906"
            class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 placeholder-slate-600">
        </div>

        <div>
          <label class="lbl" for="pass">Password</label>
          <div class="relative">
            <input type="password" id="pass" name="pass" required autocomplete="current-password"
              placeholder="••••••••"
              class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 placeholder-slate-600 pr-10">
            <button type="button" id="toggle-pass"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition text-xs"
              tabindex="-1">👁</button>
          </div>
        </div>

        <div>
          <label class="lbl" for="exam-key">Exam Access Key <span class="text-slate-600 font-normal normal-case">(optional)</span></label>
          <input type="text" id="exam-key" name="exam-key"
            placeholder="Leave blank to go to Dashboard"
            class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 placeholder-slate-600 font-mono text-sm">
        </div>

        <button type="submit" id="login-btn" class="btn-primary mt-1">
          Sign In →
        </button>

      </form>

      <div class="mt-4 flex items-center justify-between text-xs">
        <a href="forgot-password.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium">Forgot Password?</a>
        <a href="register.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium">New student? Register →</a>
      </div>
    </div>

  </div>

  <script>
    // ── Deep link / URL key auto-fill ─────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const key = new URLSearchParams(window.location.search).get('key');
      if (key) document.getElementById('exam-key').value = key;

      // Electron deep-link
      try {
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('auto-fill-key', (_, k) => {
          if (k) document.getElementById('exam-key').value = k;
        });
      } catch(e) {}
    });

    // ── Show/hide password ────────────────────────────────────────
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('pass');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    // ── API base ──────────────────────────────────────────────────
    const API_BASE = (
      window.location.protocol === 'file:' ||
      !window.location.origin ||
      window.location.origin === 'null'
    ) ? 'http://localhost:5000/api' : `${window.location.origin}/api`;

    // ── Login ─────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      const btn      = document.getElementById('login-btn');
      alertBox.classList.add('hidden');

      const roll     = document.getElementById('roll').value.trim();
      const password = document.getElementById('pass').value;
      let   examKey  = document.getElementById('exam-key').value.trim();

      if (examKey.includes('key=')) {
        examKey = examKey.split('key=')[1].split('&')[0];
      }

      if (!roll || !password) {
        alertBox.textContent = 'Roll number and password are required.';
        alertBox.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch(`${API_BASE}/auth/student/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ roll_number: roll, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed. Please check your credentials.');
        }

        // Store tokens
        localStorage.setItem('student_token', data.token);
        localStorage.setItem('token',         data.token);
        localStorage.setItem('studentToken',  data.token);
        if (data.student) {
          localStorage.setItem('student_user', JSON.stringify(data.student));
        }

        // Route
        if (examKey) {
          localStorage.setItem('active_exam_id', examKey);
          window.location.href = 'rules.html';
        } else {
          localStorage.removeItem('active_exam_id');
          window.location.href = 'dashboard.html';
        }

      } catch (err) {
        alertBox.textContent = err.message || 'Connection error with server.';
        alertBox.classList.remove('hidden');
        btn.disabled    = false;
        btn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
