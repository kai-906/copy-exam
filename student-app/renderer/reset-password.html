<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-white">Create New Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your new secure password below.</p>
    </div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">New Password</label>
        <input type="password" id="newPassword" required class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Confirm Password</label>
        <input type="password" id="confirmPassword" required class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-emerald-600/20">
        Reset Password
      </button>

      <div id="messageBox" class="hidden p-3 rounded-lg text-sm mt-4"></div>
    </form>
    
    <div class="mt-6 text-center text-sm">
      <a href="index.html" class="text-emerald-400 hover:text-emerald-300">← Back to Login</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      document.getElementById('resetForm').innerHTML = '<p class="text-red-400 text-center py-4">Invalid or missing reset token.</p>';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msgBox = document.getElementById('messageBox');
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        msgBox.className = 'p-3 rounded-lg text-sm mt-4 bg-amber-500/10 text-amber-400 border border-amber-500/20 block';
        msgBox.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';
      msgBox.className = 'hidden';

      try {
        const res = await Api.request('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });
        
        msgBox.className = 'p-3 rounded-lg text-sm mt-4 bg-green-500/10 text-green-400 border border-green-500/20 block';
        msgBox.textContent = res.message;
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } catch (err) {
        msgBox.className = 'p-3 rounded-lg text-sm mt-4 bg-red-500/10 text-red-400 border border-red-500/20 block';
        msgBox.textContent = err.message || 'Failed to reset password.';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
