<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SmartExam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height:100vh; }
    .card {
      background:rgba(30,41,59,0.9); border:1px solid rgba(99,102,241,0.2);
      border-radius:1.2rem; padding:2.2rem; box-shadow:0 24px 48px rgba(0,0,0,.45);
    }
    .lbl { display:block; font-size:.7rem; font-weight:700; text-transform:uppercase;
           letter-spacing:.06em; color:#94a3b8; margin-bottom:5px; }
    .inp { width:100%; background:#0f172a; border:1px solid #334155; color:#f1f5f9;
           padding:.65rem 1rem; border-radius:.6rem; outline:none;
           transition:border-color .18s, box-shadow .18s; font-size:.9rem; }
    .inp:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.18); }
    .inp::placeholder { color:#475569; }
    .btn-p { width:100%; background:linear-gradient(135deg,#6366f1,#8b5cf6);
             color:#fff; border:none; border-radius:.6rem; padding:.75rem;
             font-weight:700; font-size:.9rem; cursor:pointer;
             transition:opacity .2s,transform .1s; }
    .btn-p:hover:not(:disabled) { opacity:.9; transform:translateY(-1px); }
    .btn-p:disabled { opacity:.45; cursor:not-allowed; }
    .msg { padding:.6rem 1rem; border-radius:.6rem; font-size:.8rem;
           font-weight:600; margin-top:.5rem; }
    .msg-err { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#f87171; }
    .msg-ok  { background:rgba(34,197,94,.1);  border:1px solid rgba(34,197,94,.3);  color:#4ade80; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-sm">

  <div class="text-center mb-7">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 mb-3">
      <svg class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 class="text-xl font-extrabold text-white">Create New Password</h1>
    <p class="text-slate-500 text-xs mt-1">SmartExam · Student Portal</p>
  </div>

  <div class="card" id="main-card">

    <div id="no-token" class="hidden text-center py-4">
      <p class="text-slate-400 text-sm mb-4">
        This page requires a valid reset token.<br>
        Please use the Forgot Password flow to get one.
      </p>
      <a href="forgot-password.html"
         class="btn-p" style="display:block;text-decoration:none;text-align:center;">
        Go to Forgot Password →
      </a>
    </div>

    <div id="form-wrap" class="space-y-4">
      <p class="text-slate-400 text-sm mb-4">
        Enter and confirm your new password below.
      </p>

      <div>
        <label class="lbl" for="newPassword">New Password</label>
        <div class="relative">
          <input type="password" id="newPassword" class="inp pr-9" placeholder="Min 8 characters">
          <button type="button" id="tp1"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">👁</button>
        </div>
      </div>

      <div>
        <label class="lbl" for="confirmPassword">Confirm Password</label>
        <div class="relative">
          <input type="password" id="confirmPassword" class="inp pr-9" placeholder="Re-enter password">
          <button type="button" id="tp2"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">👁</button>
        </div>
      </div>

      <!-- Strength bar -->
      <div>
        <div style="height:4px;background:#1e293b;border-radius:4px;overflow:hidden;">
          <div id="strength-bar" style="height:100%;width:0%;border-radius:4px;transition:width .3s,background .3s;"></div>
        </div>
        <p id="strength-txt" class="text-xs mt-1" style="color:#64748b;min-height:16px;"></p>
      </div>

      <div id="msgBox"></div>

      <button id="submitBtn" class="btn-p">Reset Password ✓</button>
    </div>

  </div>

  <p class="text-center mt-5 text-xs text-slate-600">
    <a href="index.html" class="text-indigo-500 hover:text-indigo-400">← Back to Login</a>
  </p>

</div>

<script src="js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token     = urlParams.get('token');

  const API_BASE = (
    window.location.protocol === 'file:' ||
    !window.location.origin ||
    window.location.origin === 'null'
  ) ? 'http://localhost:5000/api' : `${window.location.origin}/api`;

  // No token → redirect to forgot-password (OTP flow)
  if (!token) {
    document.getElementById('form-wrap').classList.add('hidden');
    document.getElementById('no-token').classList.remove('hidden');
  }

  // Show/hide password toggles
  document.getElementById('tp1').addEventListener('click', () => {
    const inp = document.getElementById('newPassword');
    inp.type  = inp.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('tp2').addEventListener('click', () => {
    const inp = document.getElementById('confirmPassword');
    inp.type  = inp.type === 'password' ? 'text' : 'password';
  });

  // Password strength
  document.getElementById('newPassword').addEventListener('input', () => {
    const v   = document.getElementById('newPassword').value;
    const bar = document.getElementById('strength-bar');
    const txt = document.getElementById('strength-txt');
    let score = 0;
    if (v.length >= 8)           score++;
    if (/[A-Z]/.test(v))         score++;
    if (/[0-9]/.test(v))         score++;
    if (/[^A-Za-z0-9]/.test(v))  score++;
    const map = [
      { w:'0%',   c:'',        l:'' },
      { w:'25%',  c:'#ef4444', l:'Weak' },
      { w:'50%',  c:'#f97316', l:'Fair' },
      { w:'75%',  c:'#eab308', l:'Good' },
      { w:'100%', c:'#22c55e', l:'Strong' },
    ];
    bar.style.width      = map[score].w;
    bar.style.background = map[score].c;
    txt.textContent      = map[score].l;
    txt.style.color      = map[score].c;
  });

  function showMsg(text, type = 'err') {
    const el = document.getElementById('msgBox');
    el.className  = 'msg msg-' + type;
    el.textContent = text;
  }

  // Submit
  document.getElementById('submitBtn').addEventListener('click', async () => {
    const newPassword     = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn             = document.getElementById('submitBtn');

    if (newPassword.length < 8) { showMsg('Password must be at least 8 characters.'); return; }
    if (newPassword !== confirmPassword) { showMsg('Passwords do not match.'); return; }

    btn.disabled    = true;
    btn.textContent = 'Resetting…';

    try {
      const res  = await fetch(`${API_BASE}/auth/reset-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token, newPassword })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Failed to reset password.');

      showMsg('✅ ' + data.message, 'ok');
      document.getElementById('form-wrap').style.pointerEvents = 'none';
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);

    } catch (err) {
      showMsg(err.message);
      btn.disabled    = false;
      btn.textContent = 'Reset Password ✓';
    }
  });
</script>
</body>
</html>
