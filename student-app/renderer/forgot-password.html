<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-white">Reset Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your registered email address to receive a password reset link.</p>
    </div>

    <form id="forgotForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="student@school.edu">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-emerald-600/20">
        Send Reset Link
      </button>

      <div id="messageBox" class="hidden p-3 rounded-lg text-sm mt-4"></div>
    </form>

    <div class="mt-6 text-center text-sm">
      <a href="index.html" class="text-emerald-400 hover:text-emerald-300">← Back to Login</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msgBox = document.getElementById('messageBox');
      const email = document.getElementById('email').value;

      btn.disabled = true;
      btn.textContent = 'Sending...';
      msgBox.className = 'hidden';

      try {
        const res = await Api.request('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        
        msgBox.className = 'p-3 rounded-lg text-sm mt-4 bg-green-500/10 text-green-400 border border-green-500/20 block';
        msgBox.textContent = res.message;
        
        // FOR LOCAL TESTING
        if (res.debugToken) {
           setTimeout(() => {
             if (confirm(`[LOCAL DEBUG] A token was generated: ${res.debugToken}\n\nGo to reset page now?`)) {
               window.location.href = `reset-password.html?token=${res.debugToken}`;
             }
           }, 500);
        }
      } catch (err) {
        msgBox.className = 'p-3 rounded-lg text-sm mt-4 bg-red-500/10 text-red-400 border border-red-500/20 block';
        msgBox.textContent = err.message || 'Failed to send reset request.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
